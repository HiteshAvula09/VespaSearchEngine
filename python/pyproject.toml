[project]
name = "vespasearch"
version = "0.1.0"
description = "Neon -> Vespa hybrid search -> grounded RAG API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.9",
  "python-dotenv>=1.1.1",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vespasearch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
